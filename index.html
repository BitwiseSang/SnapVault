<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Title and Meta -->
    <title>SnapVault — Offline Snapchat Archive &amp; Memories Explorer</title>
    <meta
      name="description"
      content="A private, offline viewer for your Snapchat data export. Explore chats, saved memories, photos, videos, call statistics, and interactive snap maps locally."
    />
    <meta name="application-name" content="SnapVault" />

    <!-- Theme & Color Scheme -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#FFFC00" />
    <meta name="apple-mobile-web-app-title" content="SnapVault" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph / Social Media Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SnapVault — Offline Snapchat Archive Explorer" />
    <meta
      property="og:description"
      content="Private, local browser for Snapchat data exports. View chats, photos, videos, stats, and location maps offline."
    />
    <meta property="og:site_name" content="SnapVault" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
